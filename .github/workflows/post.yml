name: 3 · Post (все площадки)
# Каждый час: для каждого аккаунта решает, пора ли постить, и что именно.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      reset_limits:
        description: "Разово сбросить лимиты на сегодня (счётчики, паузы площадок, интервал) и выкладывать дальше по плану"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: accounts      # пост, статистика, doctor и подключение не пересекаются (общие токены)
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      IG_CLIENT_ID: ${{ secrets.IG_CLIENT_ID }}
      IG_CLIENT_SECRET: ${{ secrets.IG_CLIENT_SECRET }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      GEMINI_API_KEY_1_BOHDANREVA00: ${{ secrets.GEMINI_API_KEY_1_BOHDANREVA00 }}
      GEMINI_API_KEY_2_A82075245: ${{ secrets.GEMINI_API_KEY_2_A82075245 }}
      GEMINI_API_KEY_3_ANDREYBORUSENKO11: ${{ secrets.GEMINI_API_KEY_3_ANDREYBORUSENKO11 }}
      GEMINI_API_KEY_4_BOHDANREVA5: ${{ secrets.GEMINI_API_KEY_4_BOHDANREVA5 }}
      GEMINI_API_KEY_5_PROFITABLE_PROP_TRADING: ${{ secrets.GEMINI_API_KEY_5_PROFITABLE_PROP_TRADING }}
      GEMINI_API_KEY_6_AARONLEVIT322: ${{ secrets.GEMINI_API_KEY_6_AARONLEVIT322 }}
      GEMINI_API_KEY_7_ANONYMOUSGMAIL322: ${{ secrets.GEMINI_API_KEY_7_ANONYMOUSGMAIL322 }}
      GEMINI_API_KEY_8_GAMERAARON037: ${{ secrets.GEMINI_API_KEY_8_GAMERAARON037 }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      MONEY_CONFIG: ${{ vars.MONEY_CONFIG }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v7          # uv: установка зависимостей в разы быстрее pip
        with: {enable-cache: true, cache-dependency-glob: "requirements-light.txt"}
      - run: uv pip install --system -q -r requirements-light.txt
      - run: bash scripts/mount_state.sh
      - name: ffprobe (проверка файла перед TikTok)
        run: command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      - run: python -m clipper post ${{ inputs.reset_limits && '--reset-limits' || '' }}
      - if: failure()
        run: python -m clipper fail --job post || true
      - if: always()
        run: python -m clipper summary --job post >> "$GITHUB_STEP_SUMMARY" || true
