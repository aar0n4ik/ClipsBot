name: 2 · Process (нарезка)
# Запускается из Watch. Звук+чат куска записи → пики → речь → ИИ → проверка звука → монтаж под каждую площадку.
on:
  workflow_dispatch:
    inputs:
      retry_gaps:
        description: "Повторить пропуски (куски, которые 3 раза не обработались)"
        type: boolean
        default: false

permissions:
  contents: write      # ветка data + Release с клипами
  models: read         # бесплатный ИИ GitHub Models через GITHUB_TOKEN
  actions: read

concurrency:
  group: process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest       # 4 vCPU / 16 GB, бесплатно для публичного репозитория
    timeout-minutes: 355
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      GEMINI_API_KEY_1_BOHDANREVA00: ${{ secrets.GEMINI_API_KEY_1_BOHDANREVA00 }}
      GEMINI_API_KEY_2_A82075245: ${{ secrets.GEMINI_API_KEY_2_A82075245 }}
      GEMINI_API_KEY_3_ANDREYBORUSENKO11: ${{ secrets.GEMINI_API_KEY_3_ANDREYBORUSENKO11 }}
      GEMINI_API_KEY_4_BOHDANREVA5: ${{ secrets.GEMINI_API_KEY_4_BOHDANREVA5 }}
      GEMINI_API_KEY_5_PROFITABLE_PROP_TRADING: ${{ secrets.GEMINI_API_KEY_5_PROFITABLE_PROP_TRADING }}
      GEMINI_API_KEY_6_AARONLEVIT322: ${{ secrets.GEMINI_API_KEY_6_AARONLEVIT322 }}
      GEMINI_API_KEY_7_ANONYMOUSGMAIL322: ${{ secrets.GEMINI_API_KEY_7_ANONYMOUSGMAIL322 }}
      GEMINI_API_KEY_8_GAMERAARON037: ${{ secrets.GEMINI_API_KEY_8_GAMERAARON037 }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      MONEY_CONFIG: ${{ vars.MONEY_CONFIG }}
      RETRY_GAPS: ${{ inputs.retry_gaps && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v7          # uv: установка зависимостей в разы быстрее pip
        with: {enable-cache: true, cache-dependency-glob: "requirements.txt"}
      - run: uv pip install --system -q -r requirements.txt
      - name: Cache models
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: models-v2-${{ hashFiles('config.yaml') }}
          restore-keys: models-v2-
      - name: Cache tools (fonts, TwitchDownloaderCLI, face model)
        uses: actions/cache@v5
        with:
          path: |
            fonts
            assets/face_detection_yunet.onnx
            ~/.local/bin/TwitchDownloaderCLI
          key: tools-v1-${{ hashFiles('scripts/setup_tools.sh') }}
      - name: Tools (ffmpeg, fonts, TwitchDownloaderCLI)
        run: bash scripts/setup_tools.sh
      - run: bash scripts/mount_state.sh
      - run: python -m clipper process
      - if: failure()
        run: python -m clipper fail --job process || true
      - if: always()
        run: python -m clipper summary --job process >> "$GITHUB_STEP_SUMMARY" || true
