name: 1 · Watch Twitch
# Каждые 10 минут: стримит ли, есть ли новый кусок записи → запускает нарезку.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      MONEY_CONFIG: ${{ vars.MONEY_CONFIG }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v7          # uv: установка зависимостей в разы быстрее pip
        with: {enable-cache: true, cache-dependency-glob: "requirements-light.txt"}
      - run: uv pip install --system -q -r requirements-light.txt
      - run: bash scripts/mount_state.sh
      - run: python -m clipper watch
      - if: failure()
        run: python -m clipper fail --job watch || true
