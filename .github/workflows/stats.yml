name: 4 · Stats (просмотры, здоровье, обучение)
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accounts
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      IG_CLIENT_ID: ${{ secrets.IG_CLIENT_ID }}
      IG_CLIENT_SECRET: ${{ secrets.IG_CLIENT_SECRET }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      MONEY_CONFIG: ${{ vars.MONEY_CONFIG }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v7          # uv: установка зависимостей в разы быстрее pip
        with: {enable-cache: true, cache-dependency-glob: "requirements-light.txt"}
      - run: uv pip install --system -q -r requirements-light.txt
      - run: bash scripts/mount_state.sh
      - run: python -m clipper stats
      - if: failure()
        run: python -m clipper fail --job stats || true
