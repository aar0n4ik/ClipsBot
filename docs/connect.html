<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подключить аккаунт</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Onest:wght@400;600&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<main class="page">
  <h1>Подключить аккаунт</h1>
  <p>Бот получит доступ только к тому, что нужно для работы: загружать ролики и читать статистику своих роликов. Пароли бот не видит, доступ можно отозвать в настройках площадки в любой момент.</p>
  <label for="plat">Площадка</label>
  <select id="plat">
    <option value="tiktok">TikTok</option>
    <option value="youtube">YouTube Shorts</option>
    <option value="instagram">Instagram Reels</option>
  </select>
  <label for="acc">ID аккаунта из config.yaml</label>
  <input id="acc" value="tt_main" autocomplete="off">
  <ul class="scopes" id="scopes"></ul>
  <button class="btn" id="go" type="button">Войти</button>
  <p class="err" id="err" hidden></p>
  <p class="small" id="note"></p>
</main>
<script src="app-config.js"></script>
<script>
const cfg = window.CLIPHQ_CONFIG || {};
const redirect = location.origin + location.pathname.replace(/[^/]*$/, "") + "callback.html";
const P = {
  tiktok: { key: "tiktokClientKey", acc: "tt_main", scopes: ["user.info.basic — имя и аватар", "video.upload — отправка в черновики", "video.publish — прямая публикация (после аудита)", "video.list — просмотры своих роликов"],
    url: (id, st) => "https://www.tiktok.com/v2/auth/authorize/?" + new URLSearchParams({ client_key: id, scope: "user.info.basic,video.publish,video.upload,video.list", response_type: "code", redirect_uri: redirect, state: st }) },
  youtube: { key: "youtubeClientId", acc: "yt_main", scopes: ["youtube.upload — загрузка Shorts", "youtube.readonly — список своих роликов и просмотры", "yt-analytics.readonly — удержание (средний % досмотра)"],
    url: (id, st) => "https://accounts.google.com/o/oauth2/v2/auth?" + new URLSearchParams({ client_id: id, redirect_uri: redirect, response_type: "code", access_type: "offline", prompt: "consent", include_granted_scopes: "true", state: st,
      scope: "https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/yt-analytics.readonly" }) },
  instagram: { key: "instagramClientId", acc: "ig_main", scopes: ["instagram_business_basic — профиль", "instagram_business_content_publish — публикация Reels", "instagram_business_manage_insights — просмотры, досмотр, пропуски"],
    url: (id, st) => "https://www.instagram.com/oauth/authorize?" + new URLSearchParams({ client_id: id, redirect_uri: redirect, response_type: "code", state: st,
      scope: "instagram_business_basic,instagram_business_content_publish,instagram_business_manage_insights" }) },
};
const plat = document.getElementById("plat"), acc = document.getElementById("acc");
function show() {
  const p = P[plat.value];
  acc.value = p.acc;
  document.getElementById("scopes").innerHTML = p.scopes.map(s => "<li>" + s.replace(/^(\S+)/, "<b>$1</b>") + "</li>").join("");
}
plat.onchange = show; show();
document.getElementById("note").innerHTML = "Redirect URI для настроек всех трёх приложений и переменной <code>OAUTH_REDIRECT_URI</code>:<br><code>" + redirect + "</code>";
document.getElementById("go").onclick = () => {
  const p = P[plat.value], id = cfg[p.key], err = document.getElementById("err");
  if (!id || id === "CHANGE_ME") { err.hidden = false; err.textContent = "Впиши " + p.key + " в docs/app-config.js"; return; }
  const state = [plat.value, acc.value.trim(), crypto.getRandomValues(new Uint32Array(2)).join("")].join(".");
  sessionStorage.setItem("oauth_state", state);
  location.href = p.url(id, state);
};
</script>
</body>
</html>
